name: Update IPTV Lists

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # This runs once per day at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_URL: "https://raw.githubusercontent.com/Kimentanm/aptv/refs/heads/master/m3u/iptv.m3u"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Convert APTV list
        run: python converter.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/iptv.cleaned.m3u dist/iptv.vlc.m3u dist/iptv.kodi.m3u

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update converted IPTV lists"
            git push
          fi
